<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Registro de presença — indisponível</title>
<style>
  :root{--bg:#0B1B2B;--ink:#EAF1F0;--ink2:#A4B3B2;--accent:#4FB3C1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px;text-align:center}
  .box{max-width:460px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-bottom:18px}
  h1{font-size:1.3rem;margin:0 0 10px;color:var(--ink)}
  p{margin:0 0 8px;color:var(--ink2)}
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1>Registro de presença temporariamente indisponível</h1>
    <p>O registro de presença para este período está fora do ar no momento.</p>
    <p>Procure o seu professor para mais informações.</p>
  </div>
</body>
</html>
